<div class="container py-5 max-w-md">
 
  <div class="mb-4 header-section">
    <div class="d-flex align-items-center mb-1">
      <div class="icon-wrapper me-3 bg-primary bg-opacity-10 rounded-3 p-2">
        <i class="bi bi-clipboard2-check text-primary fs-3"></i>
      </div>
      <h2 class="fw-bold mb-0">My Tasks</h2>
    </div>
    <p class="text-muted ms-5 ps-3 mb-0">Organize your day, one task at a time.</p>
  </div>

  
  <app-create-todo (taskCreated)="onTaskCreated($event)"></app-create-todo>
  <app-todo-list [newTask]="newlyCreatedTask"></app-todo-list>
  
 
  <div class="toast-container position-fixed top-0 end-0 p-3" id="toast-container"></div>
</div>
